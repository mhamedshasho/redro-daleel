<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151519"><title>إدارة مشروعي | Redro دليل</title><link rel="stylesheet" href="/app.css"><script defer src="/owner.js"></script></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">R</span><span>REDRO <b>إدارة مشروعي</b></span></a><a href="/">العودة للدليل</a></header><main class="admin-page"><section class="panel"><h1>إدارة مشروعك</h1><p>أدخل رمز الإدارة الذي حصلت عليه بعد إرسال طلب الإضافة. الرمز مفتاح دخول خاص؛ لا تشاركه.</p><form id="owner-login"><input id="owner-token" type="password" autocomplete="off" placeholder="رمز إدارة المشروع" required><button class="button">دخول</button></form><p id="owner-message" role="status"></p></section><section id="owner-workspace" class="panel" hidden><h2>بيانات المشروع</h2><form id="owner-form" class="owner-form"><label>اسم المشروع<input name="name" maxlength="100" required></label><label>الوصف<textarea name="description" minlength="30" maxlength="1200" required></textarea></label><label>الهاتف<input name="phone" maxlength="20"></label><label>الموقع الإلكتروني<input name="website" type="url" maxlength="300"></label><label>العنوان<input name="address" maxlength="180"></label><button class="button">حفظ التعديلات</button></form><h2>صور المشروع</h2><div id="owner-images" class="admin-image-list"></div><form id="owner-upload"><input type="file" name="image" accept="image/jpeg,image/png,image/webp" required><button class="button">رفع صورة</button></form></section></main><footer class="site-footer">Redro دليل</footer></body></html>
